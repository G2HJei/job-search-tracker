  qa:
    - round: 0
      question: Why are you looking to move now?
      answer: |
        I want to work on money movement at a larger scale, with a team that writes things down.
    - round: 0
      question: What are your salary expectations?
      answer: |
        Gave a range of £95–105k base; Tom said that fits the band.
    - round: 1
      question: How do you make a POST endpoint idempotent?
      answer: |
        Client-supplied idempotency key stored with the request hash and the response, in the same
        transaction as the side effect. A replay returns the stored response; a different body with
        the same key returns 422.
    - round: 1
      question: What would you test first?
      answer: |
        Concurrent duplicate requests (two goroutines, same key) and a crash right after the ledger write.
    - round: 2
      question: How do you reconcile internal payouts against the bank's settlement file?
      answer: |
        - Load the file into a staging table keyed by bank reference
        - Match on reference, amount and currency; park mismatches in an exceptions queue
        - Daily report with ageing buckets; alert if more than 0.1% of volume is unmatched
    - round: 2
      question: What happens if the scheduler crashes halfway through a batch?
      answer: |
        Each payout is its own state machine with a lease. A restarted worker picks up expired
        leases, and the bank call uses the payout ID as the idempotency key.
    - round: 3
      question: What will I ask Rafael in the final?
      answer: |
        - How often does on-call page, and how is it compensated?
        - What does success look like for this role after six months?
        - How are build-vs-buy decisions made for the ledger?
  takeHome:
    details: |
      Build a small reconciliation service in Go:
      - Read two CSV files (internal payouts and a bank statement)
      - Output matched, unmatched and suspicious rows as JSON
      - Include tests and a short README on trade-offs

      Time box: about 4 hours. Submit a private repo link through the candidate portal.
